[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 800
via_ir = false
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 512
seed = "0x5042"

[profile.ci.fuzz]
runs = 20000

[profile.deep.fuzz]
runs = 100000

[rpc_endpoints]
arc = "${ARC_RPC_URL}"
arc_testnet = "${ARC_TESTNET_RPC_URL}"

[etherscan]
arc = { key = "${ARC_EXPLORER_KEY}", url = "https://explorer.arc.io/api", chain = 5042 }
